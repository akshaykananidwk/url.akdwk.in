; App-level PHP overrides, read automatically by PHP-FPM from the docroot.
; Keeps deprecation notices (e.g. PHP 8.5 renaming PDO::MYSQL_ATTR_SSL_CA,
; which Laravel 11 still references) off the page without touching the
; server's global PHP configuration. Real errors still go to the log.
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED & ~E_NOTICE
log_errors = On
