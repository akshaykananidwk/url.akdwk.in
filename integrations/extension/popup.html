<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { width: 320px; margin: 0; font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
  .p { padding: 14px; }
  h1 { font-size: 15px; margin: 0 0 10px; display:flex; align-items:center; gap:8px; }
  .logo { width:22px;height:22px;border-radius:6px;background:#6366f1;display:grid;place-items:center;color:#fff;font-weight:700; }
  input { width: 100%; box-sizing: border-box; padding: 9px 10px; border-radius: 9px; border: 1px solid #334155; background: #111c33; color: #e2e8f0; font-size: 13px; margin-bottom: 8px; }
  button { width: 100%; padding: 10px; border: 0; border-radius: 9px; background: #6366f1; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; }
  button:hover { background: #4f46e5; }
  .row { display: flex; gap: 6px; }
  .row input { margin-bottom: 0; }
  .row button { width: auto; padding: 0 14px; }
  .result { margin-top: 10px; display: none; }
  .muted { color: #94a3b8; font-size: 11px; margin-top: 8px; }
  a { color: #818cf8; }
  .err { color: #f87171; font-size: 12px; margin-top: 6px; }
  .settings { display:none; }
</style>
</head>
<body>
<div class="p">
  <h1><span class="logo">⛓</span> Shortl</h1>

  <div id="main">
    <div class="row">
      <input id="url" placeholder="URL to shorten">
      <button id="go">Shorten</button>
    </div>
    <div class="result" id="result">
      <div class="row">
        <input id="short" readonly>
        <button id="copy">Copy</button>
      </div>
    </div>
    <div class="err" id="err"></div>
    <div class="muted"><a href="#" id="openSettings">Settings</a></div>
  </div>

  <div class="settings" id="settingsPane">
    <input id="base" placeholder="Site URL, e.g. https://url.akdwk.in">
    <input id="key" type="password" placeholder="API key (sk_...)">
    <button id="save">Save</button>
    <div class="muted"><a href="#" id="backMain">Back</a> · Get an API key from Developers → API Keys.</div>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
